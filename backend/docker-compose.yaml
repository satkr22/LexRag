
services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_MAIN}
      POSTGRES_DB_CORPUS: ${POSTGRES_DB_CORPUS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ingestion:
    image: python:3.12-slim
    container_name: lexrag_ingestion
    working_dir: /app
    restart: "no"
    volumes:
      - ./:/app
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "pip install --no-cache-dir
      beautifulsoup4
      requests
      lxml
      pydantic
      pydantic-settings
      python-dotenv
      sqlalchemy
      psycopg2-binary
      alembic
      qdrant-client
      fastembed-gpu &&
      python app/rag/data_ingestion_pipeline.py"


volumes:
  postgres_data:
  qdrant_data:
