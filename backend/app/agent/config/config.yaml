llm:
  providers:

    gemini:
      authentication:
        env_var: GEMINI_API_KEY
        constructor_arg: api_key
      init_kwargs:
        model: "gemini-model-id"
        temperature: 0.1
        timeout: 60
        max_retries: 2
        streaming: true

    openai:
      authentication:
        env_var: OPENAI_API_KEY
        constructor_arg: api_key
      init_kwargs:
        model: "openai-model-id"
        temperature: 0.1
        timeout: 60
        max_retries: 2
        streaming: true

    rag:
      authentication:
        env_var: GEMINI_API_KEY
        constructor_arg: api_key
      init_kwargs:
        model: "gemini-model-id"
        temperature: 0.1
        timeout: 60
        max_retries: 2
        streaming: false

    default:
      authentication:
        env_var: GEMINI_API_KEY
        constructor_arg: api_key
      init_kwargs:
        model: "gemini-model-id"
        temperature: 0.1
        timeout: 60
        max_retries: 2
        streaming: true

    default-rag:
      authentication:
        env_var: GEMINI_API_KEY
        constructor_arg: api_key
      init_kwargs:
        model: "gemini-model-id"
        temperature: 0.1
        timeout: 60
        max_retries: 2
        streaming: false

  # route used by the main agent
  agent:
    active_provider: gemini
    fallback_provider: default

  # route used by RAG
  rag:
    active_provider: rag
    fallback_provider: default-rag

agent:
  system_prompt: app/agent/prompts/system.md
  recursion_limit: 20