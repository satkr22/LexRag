
services:  
  backend:
    build: ./backend
    container_name: fastapi_backend
    user: "${UID}:${GID}"
    environment:
      HOME: /tmp
    env_file:
      - .env
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:  
      - ./backend:/app
      - ./data/model_cache:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9000/docs\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload
  
  frontend:
    build: ./frontend
    container_name: lexrag_frontend
    environment:
      API_PROXY_TARGET: http://backend:9000
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
         
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_MAIN}
      POSTGRES_DB_CORPUS: ${POSTGRES_DB_CORPUS}
      POSTGRES_DB_USERS: ${POSTGRES_DB_USERS}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
